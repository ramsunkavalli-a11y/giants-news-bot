name: Giants News Bot

on:
  push:
    branches: [main]
    paths:
      - ".github/manual-clearout-trigger"
  schedule:
    # GitHub cron is UTC. Run the weekday cadence at 8:30am / 2:30pm /
    # 7:30pm / 11:30pm PT, and shift weekends earlier for day-game coverage:
    # 8:30am / 1:30pm / 5:30pm / 10:30pm PT. Each slot includes both PDT
    # and PST equivalents; the cadence gate below suppresses the inactive one.
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"

    # Weekday 2:30pm PT.
    - cron: "30 21 * * 1-5"
    - cron: "30 22 * * 1-5"

    # Weekend 1:30pm PT.
    - cron: "30 20 * * 6,0"
    - cron: "30 21 * * 6,0"

    # Weekday 7:30pm PT (next UTC calendar day).
    - cron: "30 02 * * 2-6"
    - cron: "30 03 * * 2-6"

    # Weekend 5:30pm PT (next UTC calendar day).
    - cron: "30 00 * * 0,1"
    - cron: "30 01 * * 0,1"

    # Weekday 11:30pm PT (next UTC calendar day).
    - cron: "30 06 * * 2-6"
    - cron: "30 07 * * 2-6"

    # Weekend 10:30pm PT (next UTC calendar day).
    - cron: "30 05 * * 0,1"
    - cron: "30 06 * * 0,1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Pacific-time cadence gate
        id: cadence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "run_bot=true" >> "$GITHUB_OUTPUT"
            echo "Manual clearout/dispatch: running bot."
            exit 0
          fi

          offset="$(TZ=America/Los_Angeles date +%z)"
          schedule="${{ github.event.schedule }}"
          run_bot=false

          case "$offset|$schedule" in
            # 8:30am PT every day.
            "-0700|30 15 * * *"|"-0800|30 16 * * *")
              run_bot=true
              ;;

            # Mon-Fri: 2:30pm / 7:30pm / 11:30pm PT.
            "-0700|30 21 * * 1-5"|"-0700|30 02 * * 2-6"|"-0700|30 06 * * 2-6"|\
            "-0800|30 22 * * 1-5"|"-0800|30 03 * * 2-6"|"-0800|30 07 * * 2-6")
              run_bot=true
              ;;

            # Sat-Sun: 1:30pm / 5:30pm / 10:30pm PT.
            "-0700|30 20 * * 6,0"|"-0700|30 00 * * 0,1"|"-0700|30 05 * * 0,1"|\
            "-0800|30 21 * * 6,0"|"-0800|30 01 * * 0,1"|"-0800|30 06 * * 0,1")
              run_bot=true
              ;;
          esac

          echo "run_bot=$run_bot" >> "$GITHUB_OUTPUT"
          echo "event_schedule=$schedule pacific_offset=$offset run_bot=$run_bot"

      - name: Checkout
        if: steps.cadence.outputs.run_bot == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.cadence.outputs.run_bot == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        if: steps.cadence.outputs.run_bot == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V2 bot
        if: steps.cadence.outputs.run_bot == 'true'
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          HOURS_BACK: "72"
          GAME_HOURS_BACK: "30"
          MAX_POSTS_PER_RUN: "3"
          DIAGNOSTICS_ENABLED: "1"
          DIAGNOSTICS_FILE: diagnostics.json
        run: python v2_bot.py

      - name: Upload diagnostics artifact
        if: always() && steps.cadence.outputs.run_bot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: giants-news-diagnostics
          path: diagnostics.json
          if-no-files-found: warn

      - name: Commit state if changed
        if: always() && steps.cadence.outputs.run_bot == 'true'
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "giants-news-bot"
          git config user.email "giants-news-bot@users.noreply.github.com"
          git add state.json
          git commit -m "Update state"
          git push
